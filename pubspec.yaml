name: aichatflutter
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2+1
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  path: ^1.9.0
  go_router: ^14.0.0
  pinput: ^5.0.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  crypto: ^3.0.0
  animations: ^2.0.0
  flutter_markdown: ^0.7.1
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.3
  package_info_plus: ^8.0.0
  mailer: ^6.1.0
  window_manager: ^0.3.9
  scrollable_positioned_list: ^0.3.8
  highlight: ^0.7.0
  flutter_markdown_latex: any
  flutter_math_fork: any
  markdown: any
  url_launcher: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/screenshots/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
